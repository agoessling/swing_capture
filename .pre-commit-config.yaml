minimum_pre_commit_version: "4.6.0"
repos:
  - repo: local
    hooks:
      - id: bazel-devtools-check
        name: bazel_devtools checks
        language: system
        entry: bazel
        args:
          - test
          - //...
          - --test_output=errors
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
